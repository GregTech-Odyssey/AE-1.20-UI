name: Build and Release ResourcePack
on:
  pull_request:
    branches:
      - master*
      - gto
    types:
      - closed
  workflow_dispatch:
jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [ -z "$VERSION" ]; then
            echo "VERSION is empty" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists. Bump VERSION before releasing." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version will be: ${VERSION}"
      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
      - name: Create build directory
        run: mkdir -p build
      - name: Build Light Mode ResourcePack
        if: true
        run: |
          cp LICENSE ./LightMode/LICENSE
          pushd ./LightMode
          zip -r ../build/AE-Light-UI-${{ steps.version.outputs.version }}.zip .
          popd
      - name: Build Dark Mode ResourcePack
        if: true
        run: |
          cp LICENSE ./DarkMode/LICENSE
          pushd ./DarkMode
          zip -r ../build/AE-Dark-UI-${{ steps.version.outputs.version }}.zip .
          popd
      - name: Import GPG private key
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Sign artifacts
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ls -la build/
          for file in build/*.zip; do
            if [ -n "$GPG_PASSPHRASE" ]; then
              gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --detach-sign --armor "$file"
            else
              gpg --batch --yes --detach-sign --armor "$file"
            fi
          done
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: AE-UI Multi-module ${{ steps.version.outputs.version }}
          make_latest: true
          body: |
            ## What's Changed
            * Built from `${{ github.ref_name }}` at `${{ github.sha }}`.
          files: |
            build/*.zip
            build/*.asc
          draft: false
          prerelease: false